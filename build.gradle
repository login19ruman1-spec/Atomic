plugins { id 'java' }
group = 'ru.artem.beforethefall'
version = '0.2.2-atomic'
repositories { mavenCentral(); maven { url = 'https://repo.papermc.io/repository/maven-public/' } }
dependencies { compileOnly 'io.papermc.paper:paper-api:1.21.4-R0.1-SNAPSHOT'; testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4' }
java { toolchain { languageVersion = JavaLanguageVersion.of(21) } }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.release = 21 }
test { useJUnitPlatform() }
jar { archiveBaseName = 'BeforeTheFall-Paper'; archiveVersion = project.version }
def generatedPackDir = layout.buildDirectory.dir('generated/atomic-resource-pack')
sourceSets.main.resources.srcDir(generatedPackDir)
tasks.register('generateAtomicResourcePack') {
 outputs.dir(generatedPackDir)
 doLast {
  def root=generatedPackDir.get().dir('pack').asFile;root.mkdirs()
  def writeText={String path,String value->def f=new File(root,path);f.parentFile.mkdirs();f.setText(value,'UTF-8')}
  def png={String path,int w,int h,Closure paint->def f=new File(root,path);f.parentFile.mkdirs();def im=new java.awt.image.BufferedImage(w,h,java.awt.image.BufferedImage.TYPE_INT_ARGB);def g=im.createGraphics();g.setRenderingHint(java.awt.RenderingHints.KEY_ANTIALIASING,java.awt.RenderingHints.VALUE_ANTIALIAS_OFF);paint.call(g,im);g.dispose();javax.imageio.ImageIO.write(im,'png',f)}
  writeText('pack.mcmeta','{"pack":{"pack_format":46,"description":"BeforeTheFall Atomic Survival — gas mask and filter"}}')
  png('assets/beforethefall/textures/item/atomic_gas_mask.png',16,16){g,im->g.setColor(new java.awt.Color(35,43,39));g.fillRoundRect(1,2,14,12,3,3);g.setColor(new java.awt.Color(80,100,88));g.fillRect(2,3,12,7);g.setColor(new java.awt.Color(115,190,185));g.fillRect(3,4,4,4);g.fillRect(9,4,4,4);g.setColor(new java.awt.Color(15,25,24));g.fillRect(7,4,2,5);g.setColor(new java.awt.Color(145,155,135));g.fillRect(5,10,6,3)}
  png('assets/beforethefall/textures/item/atomic_filter.png',16,16){g,im->g.setColor(new java.awt.Color(45,50,45));g.fillRect(3,1,10,14);g.setColor(new java.awt.Color(125,135,115));g.fillRect(4,2,8,12);g.setColor(new java.awt.Color(35,45,38));g.fillRect(5,4,6,7);g.setColor(new java.awt.Color(170,180,150));g.fillRect(6,5,4,1);g.fillRect(6,8,4,1);g.setColor(new java.awt.Color(90,100,85));g.fillRect(2,3,1,10);g.fillRect(13,3,1,10)}
  png('assets/beforethefall/textures/item/atomic_blast.png',32,32){g,im->g.setColor(new java.awt.Color(255,245,170));g.fillOval(11,10,10,13);g.setColor(new java.awt.Color(255,190,55));g.fillOval(6,5,20,20);g.setColor(new java.awt.Color(205,75,25));g.fillOval(2,2,28,19);g.setColor(new java.awt.Color(115,65,50));g.fillOval(4,0,9,9);g.fillOval(18,1,11,9);g.fillOval(11,0,10,7);g.setColor(new java.awt.Color(255,220,90));g.fillRect(14,17,4,13)}
  png('assets/minecraft/textures/block/snow.png',16,16){g,im->def rng=new java.util.Random(712367L);for(int y=0;y<16;y++)for(int x=0;x<16;x++){int n=rng.nextInt(5);int base=75+n*8;g.setColor(new java.awt.Color(base,base+2,base+3,255));g.fillRect(x,y,1,1)};g.setColor(new java.awt.Color(38,42,43));g.fillRect(2,3,2,1);g.fillRect(10,8,3,1);g.fillRect(5,13,2,1);g.setColor(new java.awt.Color(145,148,145));g.fillRect(6,2,2,1);g.fillRect(13,12,2,1);g.fillRect(1,10,1,2)}
  def blastFile=new File(root,'assets/beforethefall/textures/item/atomic_blast.png');blastFile.parentFile.mkdirs();def sheet=new java.awt.image.BufferedImage(128,1024,java.awt.image.BufferedImage.TYPE_INT_ARGB)
  for(int frame=0;frame<8;frame++){def g=sheet.createGraphics();g.setRenderingHint(java.awt.RenderingHints.KEY_ANTIALIASING,java.awt.RenderingHints.VALUE_ANTIALIAS_OFF);g.translate(0,frame*128);int pulse=frame%4;g.setColor(new java.awt.Color(255,105,20,170));g.fillOval(5,91-pulse,118,22+pulse);g.setColor(new java.awt.Color(255,205,45,230));g.fillOval(14,96-pulse,100,10+pulse);g.setColor(new java.awt.Color(255,90,15));g.fillPolygon(new int[]{48,57,71,82},new int[]{111,54,54,111},4);g.setColor(new java.awt.Color(255,190,35));g.fillPolygon(new int[]{54,61,68,76},new int[]{108,57,57,108},4);g.setColor(new java.awt.Color(255,245,170));g.fillRect(61,61,7,44);g.setColor(new java.awt.Color(112,57,39));g.fillOval(15,31-pulse,98,48+pulse);g.fillOval(22,17-pulse,32,35);g.fillOval(45,8-pulse,38,42);g.fillOval(76,18-pulse,30,34);g.setColor(new java.awt.Color(190,83,34));g.fillOval(19,29-pulse,90,39+pulse);g.fillOval(30,18-pulse,27,27);g.fillOval(52,12-pulse,29,32);g.fillOval(78,21-pulse,24,26);g.setColor(new java.awt.Color(255,137,28));g.fillOval(27,37-pulse,74,25+pulse);g.fillOval(39,27-pulse,23,22);g.fillOval(63,23-pulse,23,25);g.setColor(new java.awt.Color(255,207,57));g.fillOval(42,43-pulse,45,15+pulse);g.fillOval(54,34-pulse,19,17);g.setColor(new java.awt.Color(255,247,174));g.fillOval(57,46-pulse,14,10+pulse);g.dispose()}
  javax.imageio.ImageIO.write(sheet,'png',blastFile);writeText('assets/beforethefall/textures/item/atomic_blast.png.mcmeta','{"animation":{"frametime":3,"interpolate":true,"frames":[0,1,2,3,4,5,6,7]}}')
  writeText('assets/beforethefall/models/item/atomic_gas_mask.json','{"parent":"minecraft:item/generated","textures":{"layer0":"beforethefall:item/atomic_gas_mask"}}');writeText('assets/beforethefall/models/item/atomic_filter.json','{"parent":"minecraft:item/generated","textures":{"layer0":"beforethefall:item/atomic_filter"}}');writeText('assets/beforethefall/models/item/atomic_blast.json','{"parent":"minecraft:item/generated","textures":{"layer0":"beforethefall:item/atomic_blast"}}')
  writeText('assets/minecraft/models/item/leather_helmet.json','{"parent":"minecraft:item/generated","textures":{"layer0":"minecraft:item/leather_helmet"},"overrides":[{"predicate":{"custom_model_data":21},"model":"beforethefall:item/atomic_gas_mask"}]}')
  writeText('assets/minecraft/models/item/paper.json','{"parent":"minecraft:item/generated","textures":{"layer0":"minecraft:item/paper"},"overrides":[{"predicate":{"custom_model_data":20},"model":"beforethefall:item/atomic_filter"}]}')
  writeText('assets/minecraft/models/item/tnt.json','{"parent":"minecraft:item/generated","textures":{"layer0":"minecraft:item/tnt"},"overrides":[{"predicate":{"custom_model_data":3},"model":"beforethefall:item/atomic_blast"}]}')
  writeText('assets/minecraft/models/item/firework_star.json','{"parent":"minecraft:item/generated","textures":{"layer0":"minecraft:item/firework_star"},"overrides":[{"predicate":{"custom_model_data":5},"model":"beforethefall:item/nuclear_explosion"}]}')
  // Export user-supplied Blockbench free/item models and their embedded textures.
  def bbDir=new File(projectDir,'src/main/resources/blockbench')
  if(bbDir.exists()) {
   bbDir.listFiles({f->f.name.endsWith('.bbmodel') } as java.io.FileFilter).each { bb ->
    def data=new groovy.json.JsonSlurper().parse(bb)
    def modelName=data.name.toString()
    def texture=data.textures.find { it.source instanceof String && it.source.startsWith('data:image/') }
    if(texture==null) throw new GradleException("Blockbench texture missing in ${bb.name}")
    def encoded=texture.source.substring(texture.source.indexOf(',')+1)
    def textureFile=new File(root,"assets/beforethefall/textures/item/${modelName}.png")
    textureFile.parentFile.mkdirs(); textureFile.bytes=java.util.Base64.decoder.decode(encoded)
    def cubes=data.elements.findAll { it.type=='cube' && it.faces }
    def maxCoord=1.0d
    cubes.each { cube -> (cube.from+cube.to).each { value -> maxCoord=Math.max(maxCoord,Math.abs((value as Number).doubleValue())) } }
    def scale=Math.min(1.0d,7.8d/maxCoord)
    def exported=[]
    cubes.each { cube ->
     def faces=[:]
     cube.faces.each { side, face ->
      if(face.texture!=null) {
       def f=['uv':face.uv.collect { (it as Number).doubleValue() },'texture':'#0']
       if(face.rotation) f.rotation=face.rotation
       faces[side]=f
      }
     }
     def element=['from':cube.from.collect { (it as Number).doubleValue()*scale+8.0d },
                  'to':cube.to.collect { (it as Number).doubleValue()*scale+8.0d },'faces':faces]
     def rot=cube.rotation ?: [0,0,0]
     def axis=(0..2).find { Math.abs((rot[it] as Number).doubleValue())>0.0001d }
     if(axis!=null) element.rotation=['origin':(cube.origin ?: [0,0,0]).collect { (it as Number).doubleValue()*scale+8.0d },
       'axis':['x','y','z'][axis],'angle':(rot[axis] as Number).doubleValue(),'rescale':(cube.rescale ?: false)]
     exported << element
    }
    def json=['credit':'Blockbench model supplied by the project owner','parent':'minecraft:item/generated',
      'textures':['layer0':"beforethefall:item/${modelName}",'0':"beforethefall:item/${modelName}"],'elements':exported]
    def modelFile=new File(root,"assets/beforethefall/models/item/${modelName}.json")
    modelFile.parentFile.mkdirs(); modelFile.setText(groovy.json.JsonOutput.toJson(json),'UTF-8')
   }
  }
  writeText('assets/minecraft/models/item/leather_helmet.json','{"parent":"minecraft:item/generated","textures":{"layer0":"minecraft:item/leather_helmet"},"overrides":[{"predicate":{"custom_model_data":21},"model":"beforethefall:item/gas_mask"},{"predicate":{"custom_model_data":22},"model":"beforethefall:item/gas_mask"},{"predicate":{"custom_model_data":23},"model":"beforethefall:item/gas_mask"},{"predicate":{"custom_model_data":24},"model":"beforethefall:item/gas_mask"}]}')
  writeText('assets/minecraft/models/item/paper.json','{"parent":"minecraft:item/generated","textures":{"layer0":"minecraft:item/paper"},"overrides":[{"predicate":{"custom_model_data":20},"model":"beforethefall:item/gas_filter"}]}')
  writeText('assets/minecraft/models/item/tnt.json','{"parent":"minecraft:item/generated","textures":{"layer0":"minecraft:item/tnt"},"overrides":[{"predicate":{"custom_model_data":3},"model":"beforethefall:item/nuclear_bomb"}]}')
  ant.zip(destfile:new File(root.parentFile,'resourcepack.zip'),basedir:root)
 }
}
processResources.dependsOn tasks.named('generateAtomicResourcePack')
