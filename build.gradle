plugins { id 'java' }
group = 'ru.artem.beforethefall'
version = '0.2.2-atomic'
repositories { mavenCentral(); maven { url = 'https://repo.papermc.io/repository/maven-public/' } }
dependencies { compileOnly 'io.papermc.paper:paper-api:1.21.4-R0.1-SNAPSHOT'; testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4' }
java { toolchain { languageVersion = JavaLanguageVersion.of(21) } }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.release = 21 }
test { useJUnitPlatform() }
jar { archiveBaseName = 'BeforeTheFall-Paper'; archiveVersion = project.version }
def generatedPackDir = layout.buildDirectory.dir('generated/atomic-resource-pack')
sourceSets.main.resources.srcDir(generatedPackDir)
tasks.register('generateAtomicResourcePack') {
 outputs.dir(generatedPackDir)
 doLast {
  def root=generatedPackDir.get().dir('pack').asFile;root.mkdirs()
  def writeText={String path,String value->def f=new File(root,path);f.parentFile.mkdirs();f.setText(value,'UTF-8')}
  def png={String path,int w,int h,Closure paint->def f=new File(root,path);f.parentFile.mkdirs();def im=new java.awt.image.BufferedImage(w,h,java.awt.image.BufferedImage.TYPE_INT_ARGB);def g=im.createGraphics();g.setRenderingHint(java.awt.RenderingHints.KEY_ANTIALIASING,java.awt.RenderingHints.VALUE_ANTIALIAS_OFF);paint.call(g,im);g.dispose();javax.imageio.ImageIO.write(im,'png',f)}
  writeText('pack.mcmeta','{"pack":{"pack_format":46,"description":"BeforeTheFall Atomic Survival — gas mask and filter"}}')
  png('assets/minecraft/textures/block/snow.png',16,16){g,im->def rng=new java.util.Random(712367L);for(int y=0;y<16;y++)for(int x=0;x<16;x++){int n=rng.nextInt(5);int base=75+n*8;g.setColor(new java.awt.Color(base,base+2,base+3,255));g.fillRect(x,y,1,1)};g.setColor(new java.awt.Color(38,42,43));g.fillRect(2,3,2,1);g.fillRect(10,8,3,1);g.fillRect(5,13,2,1);g.setColor(new java.awt.Color(145,148,145));g.fillRect(6,2,2,1);g.fillRect(13,12,2,1);g.fillRect(1,10,1,2)}
  // 1.21.4 item definitions: ItemMeta#setItemModel resolves assets/beforethefall/items/<id>.json.
  ['dosimeter','gas_filter','gas_mask','gas_mask_cracked','gas_mask_fogged','gas_mask_cracked_fogged','nuclear_bomb','nuclear_explosion'].each { id ->
    writeText("assets/beforethefall/items/${id}.json", groovy.json.JsonOutput.toJson([
      model: [type: 'minecraft:model', model: "beforethefall:item/${id}"]
    ]))
  }
  // Export user-supplied Blockbench free/item models and their embedded textures.
  // Export Blockbench sources from both the legacy source folder and the owner upload folder.
  // Prefer the current owner uploads; fall back to the legacy Blockbench folder.
  def bbDirs=[new File(projectDir,'src/main/resources/atomic-assets/models/item'),
              new File(projectDir,'src/main/resources/blockbench')]
  def bbFiles=bbDirs.findAll { it.exists() }
      .collectMany { dir -> dir.listFiles({f->f.name.endsWith('.bbmodel')} as java.io.FileFilter).toList() }
      .groupBy { it.name }.collect { name, matches -> matches[0] }
  def requiredOwnerModels=['gas_mask','gas_filter','nuclear_bomb','nuclear_explosion','dosimeter'] as Set
  def availableOwnerModels=bbFiles.collect { f -> new groovy.json.JsonSlurper().parse(f).name.toString() } as Set
  def missingOwnerModels=requiredOwnerModels.findAll { !availableOwnerModels.contains(it) }
  if(!missingOwnerModels.isEmpty()) throw new GradleException("Missing owner-supplied Blockbench models: "+missingOwnerModels.join(', '))
  if(!bbFiles.isEmpty()) {
   bbFiles.each { bb ->
    def data=new groovy.json.JsonSlurper().parse(bb)
    def modelName=data.name.toString()
    def texture=data.textures.find { it.source instanceof String && it.source.startsWith('data:image/') }
    if(texture==null) throw new GradleException("Blockbench texture missing in ${bb.name}")
    def encoded=texture.source.substring(texture.source.indexOf(',')+1)
    def textureFile=new File(root,"assets/beforethefall/textures/item/${modelName}.png")
    textureFile.parentFile.mkdirs(); textureFile.bytes=java.util.Base64.decoder.decode(encoded)
    if(modelName=='gas_mask') {
     def baseImage=javax.imageio.ImageIO.read(textureFile)
     ['cracked','fogged','cracked_fogged'].each { state ->
      def variant=new java.awt.image.BufferedImage(baseImage.width,baseImage.height,java.awt.image.BufferedImage.TYPE_INT_ARGB)
      def vg=variant.createGraphics(); vg.drawImage(baseImage,0,0,null)
      if(state.contains('fogged')) {
       vg.setColor(new java.awt.Color(225,238,235,125)); vg.fillRoundRect(64,0,16,16,5,5)
       vg.setColor(new java.awt.Color(245,250,248,100)); vg.fillOval(67,3,10,5); vg.fillOval(65,10,13,4)
      }
      if(state.contains('cracked')) {
       vg.setStroke(new java.awt.BasicStroke(0.55f)); vg.setColor(new java.awt.Color(12,18,18,230))
       vg.drawPolyline([65,69,68,73,72,78] as int[],[1,5,8,10,13,15] as int[],6)
       vg.drawLine(69,5,66,8); vg.drawLine(73,10,77,7); vg.drawLine(72,13,69,15)
       vg.setStroke(new java.awt.BasicStroke(0.25f)); vg.setColor(new java.awt.Color(225,235,228,245))
       vg.drawPolyline([65,69,68,73,72,78] as int[],[0,4,7,9,12,14] as int[],6)
       vg.drawLine(69,4,66,7); vg.drawLine(73,9,77,6); vg.drawLine(72,12,69,14)
      }
      vg.dispose()
      javax.imageio.ImageIO.write(variant,'png',new File(root,"assets/beforethefall/textures/item/gas_mask_${state}.png"))
     }
    }
    // Blockbench stores UV coordinates in source-image pixels; Minecraft uses 0..16.
    def textureWidth=Math.max(1, ((data.resolution?.width ?: texture.width ?: 16) as Number).intValue())
    def textureHeight=Math.max(1, ((data.resolution?.height ?: texture.height ?: 16) as Number).intValue())
    def cubes=data.elements.findAll { it.type=='cube' && it.faces }
    def maxCoord=1.0d
    cubes.each { cube -> (cube.from+cube.to).each { value -> maxCoord=Math.max(maxCoord,Math.abs((value as Number).doubleValue())) } }
    def scale=Math.min(1.0d,7.8d/maxCoord)
    def exported=[]
    cubes.each { cube ->
     def faces=[:]
     cube.faces.each { side, face ->
      if(face.texture!=null) {
       if(!(face.uv instanceof List) || face.uv.size()!=4) {
        throw new GradleException("Invalid UV coordinates in " + bb.name + " (" + side + ")")
       }
       def uv=[]
       face.uv.eachWithIndex { coordinate, index ->
        double dimension=(index % 2 == 0) ? textureWidth : textureHeight
        uv << (coordinate as Number).doubleValue() * 16.0d / dimension
       }
       if(uv.any { it < -0.001d || it > 16.001d }) {
        throw new GradleException("UV coordinates outside Minecraft 0..16 range in " + bb.name + " (" + side + "): " + uv)
       }
       def f=['uv':uv,'texture':'#0']
       if(face.rotation) f.rotation=face.rotation
       faces[side]=f
      }
     }
     def element=['from':cube.from.collect { (it as Number).doubleValue()*scale+8.0d },
                  'to':cube.to.collect { (it as Number).doubleValue()*scale+8.0d },'faces':faces]
     def rot=cube.rotation ?: [0,0,0]
     def axis=(0..2).find { Math.abs((rot[it] as Number).doubleValue())>0.0001d }
     if(axis!=null) element.rotation=['origin':(cube.origin ?: [0,0,0]).collect { (it as Number).doubleValue()*scale+8.0d },
       'axis':['x','y','z'][axis],'angle':(rot[axis] as Number).doubleValue(),'rescale':(cube.rescale ?: false)]
     exported << element
    }
    // Render the exported cubes as a real 3-D item model, not a flat generated sprite.
    def display=[
      gui:[rotation:[30,225,0],translation:[0,0,0],scale:[0.625,0.625,0.625]],
      ground:[rotation:[0,0,0],translation:[0,3,0],scale:[0.25,0.25,0.25]],
      fixed:[rotation:[0,180,0],translation:[0,0,0],scale:[1.0,1.0,1.0]],
      thirdperson_righthand:[rotation:[0,90,0],translation:[0,1.5,-2.75],scale:[0.375,0.375,0.375]],
      thirdperson_lefthand:[rotation:[0,-90,0],translation:[0,1.5,-2.75],scale:[0.375,0.375,0.375]],
      firstperson_righthand:[rotation:[0,-90,25],translation:[1.13,3.2,1.13],scale:[0.68,0.68,0.68]],
      firstperson_lefthand:[rotation:[0,90,-25],translation:[1.13,3.2,1.13],scale:[0.68,0.68,0.68]]
    ]
    def json=['credit':'Blockbench model supplied by the project owner','parent':'minecraft:block/block',
      'textures':['particle':"beforethefall:item/${modelName}",'0':"beforethefall:item/${modelName}"],
      'elements':exported,'display':display]
    def modelFile=new File(root,"assets/beforethefall/models/item/${modelName}.json")
    modelFile.parentFile.mkdirs(); modelFile.setText(groovy.json.JsonOutput.toJson(json),'UTF-8')
    if(modelName=='gas_mask') {
     ['cracked','fogged','cracked_fogged'].each { state ->
      def variantJson=new LinkedHashMap(json)
      variantJson.textures=['particle':"beforethefall:item/gas_mask_${state}",'0':"beforethefall:item/gas_mask_${state}"]
      def vf=new File(root,"assets/beforethefall/models/item/gas_mask_${state}.json")
      vf.parentFile.mkdirs(); vf.setText(groovy.json.JsonOutput.toJson(variantJson),'UTF-8')
     }
    }
   }
  }

 }
}
processResources.dependsOn tasks.named('generateAtomicResourcePack')


apply from: 'atomic-assets.gradle'
