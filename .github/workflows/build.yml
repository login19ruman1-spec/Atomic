name: Build Paper plugin

on:
  push:
    branches: [ main, master, paper-1.21.4-release-docs ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'
      - name: Compile and test
        run: gradle --no-daemon clean test build
      - name: Verify plugin descriptor
        run: unzip -l build/libs/BeforeTheFall-Paper-*.jar | grep -E ' plugin.yml$'
      - name: Verify embedded resource pack
        run: |
          JAR=$(find build/libs -name 'BeforeTheFall-Paper-*.jar' -print -quit)
          unzip -p "$JAR" resourcepack.zip > build/resourcepack.zip
          unzip -t build/resourcepack.zip
          unzip -l build/resourcepack.zip | grep -E 'assets/beforethefall/items/(nuclear_bomb|nuclear_explosion|gas_mask|gas_filter|dosimeter).json'
          unzip -l build/resourcepack.zip | grep -E 'assets/beforethefall/models/item/(nuclear_bomb|nuclear_explosion|gas_mask|gas_filter|dosimeter).json'
          unzip -l build/resourcepack.zip | grep -E 'assets/beforethefall/textures/item/(nuclear_bomb|nuclear_explosion|gas_mask|gas_filter|dosimeter).png'
          unzip -l build/resourcepack.zip | grep -E 'assets/beforethefall/textures/gui/gasmask_overlay(_ash|_cracked)?.png'
          unzip -l build/resourcepack.zip | grep -E 'assets/beforethefall/sounds/blast/(close|wave|distant).ogg'
          unzip -l build/resourcepack.zip | grep -E 'assets/beforethefall/sounds/(gas-mask/(equip|filter|breath|empty)|dosimeter/measure).ogg'
          unzip -l build/resourcepack.zip | grep -E 'assets/beforethefall/equipment/protective_suit.json'
          unzip -l build/resourcepack.zip | grep -E 'assets/beforethefall/textures/entity/equipment/(humanoid|humanoid_leggings)/protective_suit.png'
          unzip -p build/resourcepack.zip assets/beforethefall/sounds.json | grep -E 'gas_mask_on|gas_mask_filter|gas_mask_breath|gas_mask_empty|dosimeter_measure|blast_close|blast_wave|blast_distant'
          python - <<'PY'
          import struct, zipfile
          with zipfile.ZipFile('build/resourcepack.zip') as pack:
              for name in (
                  'assets/beforethefall/textures/entity/equipment/humanoid/protective_suit.png',
                  'assets/beforethefall/textures/entity/equipment/humanoid_leggings/protective_suit.png',
              ):
                  data = pack.read(name)
                  assert data[:8] == b'\x89PNG\r\n\x1a\n', f'{name} is not PNG'
                  width, height = struct.unpack('>II', data[16:24])
                  assert (width, height) == (64, 32), f'{name}: expected 64x32, got {width}x{height}'
          print('Protective suit textures: valid 64x32 PNGs')
          PY

      - name: Publish resource pack for automatic client download
        id: resourcepack_release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: resourcepack9-latest
          name: Atomic resource pack (verified latest)
          draft: true
          prerelease: true
          make_latest: false
          overwrite_files: true
          files: |
            build/resourcepack.zip
            build/libs/BeforeTheFall-Paper-*.jar
      - name: Publish resource pack release after uploading assets
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api repos/${{ github.repository }}/releases/${{ steps.resourcepack_release.outputs.id }} -X PATCH -F draft=false
      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: BeforeTheFall-Paper-1.21.4
          path: build/libs/BeforeTheFall-Paper-*.jar
          if-no-files-found: error
          retention-days: 30
