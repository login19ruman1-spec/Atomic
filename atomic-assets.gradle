// Optional owner-supplied assets. Files placed here are merged into the generated pack.
def atomicAssetsDir = file('src/main/resources/atomic-assets')

tasks.named('generateAtomicResourcePack') {
    doLast {
        def packRoot = layout.buildDirectory.dir('generated/atomic-resource-pack').get().dir('pack').asFile
        def copyAssetTree = { String sourcePath, String targetPath ->
            def source = new File(atomicAssetsDir, sourcePath)
            if (source.exists()) {
                copy {
                    from source
                    into new File(packRoot, targetPath)
                }
            }
        }

        // Upload PNGs preserving their relative paths, e.g. textures/gui/gas_mask_overlay.png.
        copyAssetTree('textures', 'assets/beforethefall/textures')
        // Convenience folder for uploaded reference/gameplay photos; packaged as textures/photos/.
        copyAssetTree('photos', 'assets/beforethefall/textures/photos')
        // Optional custom item/block model JSON files, preserving relative paths.
        copyAssetTree('models', 'assets/beforethefall/models')
        // Gas-mask upload area: drop PNGs, item model JSONs and OGG sounds into the three dedicated folders.
        copyAssetTree('gas-mask/textures', 'assets/beforethefall/textures/item')
        copyAssetTree('gas-mask/models', 'assets/beforethefall/models/item')

        // Copy uploaded audio bytes into the actual resource pack before it is zipped.
        def soundsDir = new File(atomicAssetsDir, 'sounds')
        def gasMaskSoundsDir = new File(atomicAssetsDir, 'gas-mask/sounds')
        if (gasMaskSoundsDir.exists()) {
            copy {
                from gasMaskSoundsDir
                include '**/*.ogg'
                into new File(packRoot, 'assets/beforethefall/sounds')
            }
        }
        if (soundsDir.exists()) {
            copy {
                from soundsDir
                include '**/*.ogg'
                into new File(packRoot, 'assets/beforethefall/sounds')
            }
        }

        // Sound files are uploaded under sounds/, and exposed as stable sound event IDs.
        def soundEvents = [
            blast_close: 'blast/close',
            blast_wave: 'blast/wave',
            blast_distant: 'blast/distant',
            nuke_charge: 'nuke/charge',
            nuke_launch: 'nuke/launch',
            nuke_blast: 'nuke/blast',
            nuke_impact: 'nuke/impact',
            nuke_fallout: 'nuke/fallout',
            dosimeter_measure: 'dosimeter/measure'
        ]
        def soundsJson = [:]
        ['gas_mask_on': 'gas-mask/equip', 'gas_mask_filter': 'gas-mask/filter', 'gas_mask_breath': 'gas-mask/breath', 'gas_mask_empty': 'gas-mask/empty'].each { eventName, relativePath ->
            def soundFile = new File(gasMaskSoundsDir, relativePath + '.ogg')
            if (soundFile.exists()) {
                soundsJson[eventName] = [sounds: [[name: 'beforethefall:' + relativePath, stream: true]]]
            }
        }
        // New, simple upload layout: all sound categories live under gas-mask/sounds/.
        ['blast_close': 'blast/close', 'blast_wave': 'blast/wave', 'blast_distant': 'blast/distant',
         'dosimeter_measure': 'dosimeter/measure'].each { eventName, relativePath ->
            def soundFile = new File(gasMaskSoundsDir, relativePath + '.ogg')
            if (soundFile.exists()) {
                soundsJson[eventName] = [sounds: [[name: 'beforethefall:' + relativePath, stream: true]]]
            }
        }
        soundEvents.each { eventName, soundPath ->
            def soundFile = new File(soundsDir, soundPath + '.ogg')
            if (soundFile.exists()) {
                soundsJson[eventName] = [sounds: [[name: "beforethefall:" + soundPath, stream: true]]]
            }
        }
        // Extend the positional blast layers to the configured 500-block listening radius.
        ['blast_close', 'blast_distant', 'blast_wave'].each { eventName ->
            if (soundsJson.containsKey(eventName)) {
                soundsJson[eventName].attenuation_distance = 500
            }
        }

        if (!soundsJson.isEmpty()) {
            def soundJsonFile = new File(packRoot, 'assets/beforethefall/sounds.json')
            soundJsonFile.parentFile.mkdirs()
            soundJsonFile.setText(groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(soundsJson)), 'UTF-8')
        }

        // 1.21.4 item definitions are addressed by ItemMeta#setItemModel.
        ['dosimeter', 'gas_mask', 'gas_filter', 'nuclear_bomb'].each { id ->
            def itemDefinition = new File(packRoot, "assets/beforethefall/items/${id}.json")
            itemDefinition.parentFile.mkdirs()
            itemDefinition.setText(groovy.json.JsonOutput.toJson([
                model: [type: 'minecraft:model', model: "beforethefall:item/${id}"]
            ]), 'UTF-8')
        }

        // Keep user-supplied files visible in the build log for easier troubleshooting.
        def uploaded = []
        ['textures', 'photos', 'models', 'sounds', 'gas-mask'].each { folder ->
            def dir = new File(atomicAssetsDir, folder)
            if (dir.exists()) {
                dir.eachFileRecurse { f -> if (f.isFile()) uploaded << f.toString().replace(atomicAssetsDir.toString() + File.separator, '') }
            }
        }
        logger.lifecycle("Atomic custom assets copied: " + (uploaded.isEmpty() ? 'none yet' : uploaded.sort().join(', ')))

        // IMPORTANT: zip only after every owner-supplied model, texture, sound and sounds.json
        // has been copied into packRoot. Previously build.gradle zipped too early.
        ant.zip(destfile: new File(packRoot.parentFile, 'resourcepack.zip'), basedir: packRoot)
    }
}
